function go(p){page=p;render()}
function market(){let items=data.sellers.filter(s=>(category==='All'||s.category===category)&&(city==='All'||s.city===city)&&[s.name,s.product,s.category].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>({Gold:0,Silver:1,Free:2}[a.tier]-{Gold:0,Silver:1,Free:2}[b.tier]));return `<div class="market-hero"><div><span class="eyebrow">${year>=3?'YEAR '+year+' · ONLINE SHOPPING':'YEAR '+year+' · BUSINESS DISCOVERY'}</span><h2>${year>=3?'Shop online. Sell with confidence.':'Discover trusted Afghan suppliers.'}</h2><p>${year>=3?'Browse products, choose quantities and place a simulated online order.':'Connect directly with verified cosmetics and textiles suppliers.'}</p></div><div class="hero-icon">${year>=3?'🛒':'🤝'}</div></div><div class="row"><input class="field" style="flex:2;min-width:190px" placeholder="Search products or sellers" value="${escape(query)}" oninput="query=this.value;updateMarket()"><select class="field" style="flex:1" onchange="category=this.value;updateMarket()"><option>All</option>${['Cosmetics','Textiles'].map(x=>`<option ${category===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" style="flex:1" onchange="city=this.value;updateMarket()"><option>All</option>${['Kabul','Herat','Mazar-e-Sharif'].map(x=>`<option ${city===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="products" class="grid">${items.map(s=>`<div class="card product"><div class="art">${s.image?`<img class="product-image" src="${s.image}" alt="${escape(s.product)}">`:s.emoji}</div><div class="pad"><div class="row space"><small>${s.category} · ${s.city}</small><span class="badge ${s.verified?'':'pending'}">${s.verified?'✓ Verified':'Unverified'}</span></div><h3>${escape(s.product)}</h3>${s.description?`<p class="muted product-desc">${escape(s.description)}</p>`:""}<div class="price">${money(s.price)}</div><p class="muted">${escape(s.name)} · ${s.tier} · ★ ${s.rating}</p><div class="row">${year>=3?`<button class="gold" onclick="buyProduct(${s.id})">🛒 Buy now</button>`:""}<button onclick="contact(${s.id})">Contact seller</button><button class="secondary" onclick="review(${s.id})">Rate</button></div></div></div>`).join('')||'<p>No matching products.</p>'}</div>`}
function updateMarket(){$('content').innerHTML=market()}
function contact(id){let message=prompt('Message to '+seller(id).name+' (fictional demo only):');if(message){data.messages.push({seller:seller(id).name,message,created:new Date().toLocaleString()});save();alert('Demo message saved locally. No message was sent.')}}
function review(id){let r=Number(prompt('Demo rating (1 to 5):'));if(r>=1&&r<=5){seller(id).rating=r;save();render()}}
function auctions(){return `<h2>Gold-exclusive auctions · 3% fee on completed sales</h2><p class="muted">Only Gold sellers can create auctions. Registered demo buyers may bid. Highest valid bid wins when closed.</p><div class="grid">${data.auctions.map(a=>`<div class="card"><span class="badge">${a.status}</span><h3>${escape(a.product)}</h3><p>${escape(seller(a.seller).name)} · Gold</p><div class="stat">${money(a.bid)}</div><p class="muted">Leading bidder: ${escape(a.bidder)} · Fee if completed: ${money(a.bid*.03)}</p>${a.status==='Open'?`<button onclick="bid(${a.id})">Place bid</button> <button class="secondary" onclick="closeAuction(${a.id})">Close & complete demo sale</button>`:''}</div>`).join('')}</div>`}
function bid(id){let a=data.auctions.find(x=>x.id===id),n=Number(prompt('Enter bid (minimum '+money(a.bid+1)+')'));if(!Number.isFinite(n)||n<a.bid+1)return alert('Bid must exceed the current bid by at least $1.');a.bid=n;a.bidder='Demo Buyer';save();render()}
function closeAuction(id){let a=data.auctions.find(x=>x.id===id);if(confirm('Mark this fictional auction as completed?')){a.status='Completed';save();render()}}
function plans(){let tiers=[{name:'Free',price:0,sub:'Start your business journey',features:['Create a business profile','List products in the marketplace','Receive buyer inquiries','Direct buyer–seller contact','Basic storefront visibility'],color:'free'},{name:'Silver',price:year>=4?10:5,sub:'Build credibility and reach',features:['Everything in Free','Business-document verification review','Verified seller badge after approval','Priority marketplace placement','Improved seller visibility'],color:'silver'},{name:'Gold',price:year>=4?15:10,sub:'Grow with premium tools',features:['Everything in Silver','Premium marketplace placement','Exclusive right to create auctions','Gold seller recognition','Advanced visibility for listings'],color:'gold'}];return `<div class="section-head"><span class="eyebrow">MEMBERSHIP OPTIONS</span><h2>Find the right plan for your business</h2><p class="muted">Simple annual plans designed for Afghan cosmetics and textiles sellers.</p></div><div class="membership-grid">${tiers.map(p=>`<article class="membership-card ${p.color}"><div class="plan-top"><span class="plan-symbol">${p.name==='Free'?'✦':p.name==='Silver'?'◈':'✦'}</span>${p.name==='Gold'?'<span class="popular">MOST FEATURES</span>':''}</div><h2>${p.name}</h2><p class="plan-sub">${p.sub}</p><div class="plan-price">${money(p.price)} <small>/ year</small></div><div class="plan-divider"></div><h3>What's included</h3><ul class="feature-list">${p.features.map(f=>`<li><span>✓</span> ${f}</li>`).join('')}</ul><button class="plan-button" onclick="go('seller')">Choose ${p.name}</button></article>`).join('')}</div><p class="muted" style="margin-top:18px">Membership prices follow the Etemad plan: Years 1–3 Silver $5 and Gold $10; Years 4–5 Silver $10 and Gold $15. Verification is subject to admin approval in this demo.</p>`}
function sellerStudio(){return `<div class="section-head"><span class="eyebrow">BECOME A SELLER</span><h2>Register your business</h2><p class="muted">Submit your fictional business details for the classroom verification workflow. Already approved? Open the separate Seller Dashboard to publish products.</p></div><div class="registration-wrap"><div class="card"><h3>Apply for seller verification</h3><form onsubmit="apply(event)"><label>Business name<input required name="name" class="field" maxlength="70"></label><label>City<select name="city" class="field"><option>Kabul</option><option>Herat</option><option>Mazar-e-Sharif</option></select></label><label>Category<select name="category" class="field"><option>Cosmetics</option><option>Textiles</option></select></label><label>Membership<select name="tier" class="field"><option>Free</option><option>Silver</option><option>Gold</option></select></label><label>Fictional license reference<input required name="license" class="field" placeholder="DEMO-LIC-000"></label><label>Upload business license (demo file)<input required type="file" name="licenseFile" class="field" accept=".pdf,.png,.jpg,.jpeg"></label><label>Upload selling permit or ID (demo file)<input type="file" name="supportFile" class="field" accept=".pdf,.png,.jpg,.jpeg"></label><p class="muted" style="font-size:12px">Classroom simulation: Select only fictional/sample files. The prototype records file names only; files are not uploaded, stored or reviewed by a real server. Maximum 5 MB per file.</p><button type="submit">Submit for review</button></form></div></div><p class="muted">Selected document names are stored locally. No real files are uploaded.</p>`}
function sellerDashboard(){return `<div class="section-head"><span class="eyebrow">SELLER WORKSPACE</span><h2>Seller Dashboard</h2><p class="muted">Manage your storefront and publish professional product listings.</p></div><div class="grid dashboard-stats"><div class="card"><div class="muted">Registered storefronts</div><div class="stat">${data.sellers.length}</div></div><div class="card"><div class="muted">Products listed</div><div class="stat">${data.sellers.filter(s=>s.product).length}</div></div><div class="card"><div class="muted">Buyer inquiries</div><div class="stat">${data.messages.length}</div></div></div><div class="grid seller-workspace"><div class="card"><h3>＋ Add a new product</h3><p class="muted">Fill in the product details below. A demo image is stored only in your browser.</p><form onsubmit="addProduct(event)"><label>Choose your approved seller account<select required name="sellerId" class="field">${data.sellers.map(s=>`<option value="${s.id}">${escape(s.name)} · ${s.tier}</option>`).join('')}</select></label><label>Product name<input required name="productName" class="field" maxlength="90" placeholder="e.g. Premium Cotton Fabric"></label><label>Product description<textarea required name="description" class="field" rows="4" maxlength="600" placeholder="Describe material, quality, quantity and key features"></textarea></label><label>Product category<select name="category" class="field"><option>Cosmetics</option><option>Textiles</option></select></label><label>Minimum price (USD)<input required name="price" class="field" type="number" min="0.01" step="0.01" placeholder="0.00"></label><label>Product picture<input name="picture" type="file" class="field" accept="image/png,image/jpeg,image/webp"></label><p class="muted" style="font-size:12px">Optional JPG, PNG or WebP image (max 150 KB). The image stays in this browser; it is not uploaded online.</p><button class="gold" type="submit">Publish product listing</button></form></div><div class="card"><h3>Your marketplace listings</h3><div class="listing-scroll">${data.sellers.map(s=>`<div class="mini-listing"><div class="mini-art">${s.image?'<span>🖼️</span>':s.emoji}</div><div><strong>${escape(s.product)}</strong><div class="muted">${escape(s.name)} · ${money(s.price)}</div></div></div>`).join('')}</div><hr><h3>Gold auction tools</h3><p class="muted">Only Gold sellers may launch bidding listings.</p><button class="gold" onclick="newAuction()">Create Gold auction</button><hr><h3>Recent buyer inquiries</h3>${data.messages.slice(-5).map(m=>`<p><strong>${escape(m.seller)}:</strong> ${escape(m.message)}</p>`).join('')||'<p class="muted">No demo messages yet.</p>'}</div></div>`}
async function addProduct(e){e.preventDefault();let f=new FormData(e.target),owner=seller(Number(f.get('sellerId'))),price=Number(f.get('price')),file=f.get('picture');if(!owner||!owner.id||!Number.isFinite(price)||price<=0)return alert('Select a valid seller and minimum price.');let image='';if(file&&file.size){if(file.size>150*1024)return alert('Use a picture smaller than 150 KB for this browser-only demo.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return alert('Please select a JPG, PNG or WebP picture.');image=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});}let item={...owner,id:Date.now(),product:String(f.get('productName')).trim(),description:String(f.get('description')).trim(),category:f.get('category'),price,image};if(!item.product||!item.description)return alert('Please complete the product details.');data.sellers.push(item);try{save()}catch(err){data.sellers.pop();return alert('Browser storage is full. Try a smaller picture.')}alert('Your product has been published to this browser\'s demo marketplace.');render()}
function buyProduct(id){if(year<3)return alert('Online shopping starts in Year 3.');let s=seller(id),quantity=Number(prompt('How many units of '+s.product+' would you like to buy?', '1'));if(!Number.isInteger(quantity)||quantity<1||quantity>10000)return alert('Please enter a whole-number quantity between 1 and 10,000.');let amount=quantity*s.price,fee=amount*.02;if(!confirm('Demo checkout: '+quantity+' × '+s.product+' = '+money(amount)+'\nPlace fictional order? No real payment will occur.'))return;data.orders.push({seller:s.name,product:s.product,quantity,amount,fee,status:'Demo order placed'});save();alert('Demo order placed! No money was charged.');go('checkout')}
function apply(e){e.preventDefault();let f=new FormData(e.target),files=['licenseFile','supportFile'].map(k=>f.get(k)).filter(x=>x&&x.size);if(files.some(x=>x.size>5*1024*1024))return alert('Each demo file must be 5 MB or smaller.');if(files.some(x=>!(/\\.(pdf|png|jpe?g)$/i).test(x.name)))return alert('Use PDF, PNG, JPG or JPEG files only.');let application={id:Date.now(),name:f.get('name'),city:f.get('city'),category:f.get('category'),tier:f.get('tier'),license:f.get('license'),licenseFile:f.get('licenseFile')?.name||'',supportFile:f.get('supportFile')?.name||'',status:'Pending'};data.applications.push(application);save();alert('Application queued for demo admin review. Only selected file names were saved; no documents were uploaded.');render()}
function newAuction(){let gold=data.sellers.filter(x=>x.tier==='Gold');let id=Number(prompt('Gold seller ID: '+gold.map(x=>x.id+' = '+x.name).join(', ')));if(!gold.some(x=>x.id===id))return alert('Only Gold sellers can create auctions.');let product=prompt('Auction item name:');let bid=Number(prompt('Starting bid in USD:'));if(!product||!(bid>0))return;data.auctions.push({id:Date.now(),seller:id,product,bid,bidder:'No bids yet',status:'Open'});save();render()}
function admin(){return `<h2>Administration · verification and trust</h2><div class="grid"><div class="card"><div class="muted">Pending applications</div><div class="stat">${data.applications.filter(x=>x.status==='Pending').length}</div></div><div class="card"><div class="muted">Open disputes</div><div class="stat">${data.disputes.filter(x=>x.status==='Open').length}</div></div><div class="card"><div class="muted">Completed auctions</div><div class="stat">${data.auctions.filter(x=>x.status==='Completed').length}</div></div></div><h3>Verification queue</h3><table><tr><th>Business</th><th>City</th><th>Tier</th><th>License (demo)</th><th>Selected files (names only)</th><th>Status</th><th>Action</th></tr>${data.applications.map(a=>`<tr><td>${escape(a.name)}</td><td>${escape(a.city)}</td><td>${escape(a.tier)}</td><td>${escape(a.license)}</td><td>${escape([a.licenseFile,a.supportFile].filter(Boolean).join(', ')||'None')}</td><td>${a.status}</td><td>${a.status==='Pending'?`<button onclick="decide(${a.id},'Approved')">Approve</button> <button class="secondary" onclick="decide(${a.id},'Rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</table><h3>Dispute review</h3><table><tr><th>Seller</th><th>Issue</th><th>Status</th><th>Action</th></tr>${data.disputes.map(d=>`<tr><td>${escape(d.seller)}</td><td>${escape(d.issue)}</td><td>${d.status}</td><td>${d.status==='Open'?`<button onclick="resolveDispute(${d.id})">Resolve</button>`:'—'}</td></tr>`).join('')}</table><p><button class="secondary" onclick="resetDemo()">Reset all demonstration data</button></p>`}
function decide(id,status){let a=data.applications.find(x=>x.id===id);a.status=status;if(status==='Approved')data.sellers.push({id:Date.now(),name:a.name,city:a.city,category:a.category,tier:a.tier,verified:a.tier!=='Free',product:'New demo storefront',price:10,emoji:a.category==='Textiles'?'🧵':'🧴',rating:5});save();render()}
function resolveDispute(id){data.disputes.find(x=>x.id===id).status='Resolved';save();render()}
function resetDemo(){if(confirm('Erase all browser-local demo changes?')){data=structuredClone(initial);save();render()}}
function checkout(){return `<h2>Year 3+ online orders and escrow concept</h2>${year<3?'<div class="notice">Roadmap preview only: checkout is planned for Year 3, not available in the Year 1 launch.</div>':''}<div class="grid"><div class="card"><h3>Simulate an escrow transaction</h3><label>Seller<select class="field" id="checkoutSeller">${data.sellers.filter(x=>x.tier!=='Free').map(s=>`<option value="${s.id}">${escape(s.name)}</option>`).join('')}</select></label><label>Order value (USD)<input class="field" id="amount" type="number" min="1" value="100"></label><label>Commission rate<select class="field" id="rate"><option value=".02">2%</option><option value=".03">3%</option></select></label><button onclick="simulateCheckout()">Simulate checkout</button></div><div class="card"><h3>Escrow stages (simulation)</h3><p>1. Buyer initiates payment</p><p>2. Funds held in escrow (illustrative only)</p><p>3. Seller fulfills order</p><p>4. Buyer confirms delivery</p><p>5. Seller receives balance after commission</p><strong>No actual funds are processed or held.</strong></div></div><h3>Demo transaction history</h3><table><tr><th>Seller</th><th>Product</th><th>Order</th><th>Commission</th><th>Seller proceeds</th></tr>${data.orders.map(o=>`<tr><td>${escape(o.seller)}</td><td>${escape(o.product||'Demo checkout')}</td><td>${money(o.amount)}</td><td>${money(o.fee)}</td><td>${money(o.amount-o.fee)}</td></tr>`).join('')}</table>`}
function simulateCheckout(){let amount=Number($('amount').value),rate=Number($('rate').value);if(!(amount>0))return alert('Enter a valid order value.');let s=seller(Number($('checkoutSeller').value));data.orders.push({seller:s.name,amount,fee:amount*rate});save();render();alert('Fictional checkout completed. No real payment occurred.')}
function roadmap(){return `<h2>Five-year growth roadmap</h2><div class="grid">${[[1,'Kabul launch','1,000 businesses; 400 Silver; 100 Gold; bidding live'],[2,'Kabul expansion','3,000 businesses; 1,200 Silver; 300 Gold'],[3,'Escrow introduction','Secure checkout and 2–3% transaction commission'],[4,'Regional partnerships','Herat and Mazar-e-Sharif expansion; logistics and mobile-money partnerships'],[5,'Scale-up','20,000 registered businesses; 8,000 Silver; 2,000 Gold; $1.5M GMV target']].map(([n,title,desc])=>`<div class="card" style="border-top:4px solid ${year===n?'#b88c36':'#102a46'}"><span class="muted">YEAR ${n}</span><h3>${title}</h3><p>${desc}</p></div>`).join('')}</div><h2>Business model assumptions</h2><p>Startup budget $9,600, founders' capital $18,000, no bank debt. Initial direct seller contact; 3% Gold auction fee from Year 1; broader checkout commission from Year 3.</p><p class="muted">Targets are business-plan projections, not achieved operating results.</p>`}
function home(){let verified=data.sellers.filter(s=>s.verified).length;return `<section class="home-hero"><div class="home-hero-content"><span class="hero-label"><span class="sparkle">✦</span> A NEW ERA OF AFGHAN COMMERCE</span><h2>Where trusted businesses <em>move forward.</em></h2><p>Discover verified suppliers, showcase your products and build meaningful trade relationships. From Kabul to the rest of Afghanistan.</p><div class="hero-buttons"><button class="gold" onclick="go('market')">Explore marketplace <span>↗</span></button><button class="hero-outline" onclick="go('seller')">Become a seller</button></div><div class="hero-proof"><span>✓ Business verification</span><span>✓ Direct supplier connections</span><span>✓ Designed for growth</span></div></div><div class="home-hero-visual"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="hero-display"><div class="hero-display-head"><span>✦</span> THE ETEMAD NETWORK</div><div class="hero-display-icon">◈</div><div class="hero-display-caption">CONNECTED BY TRUST</div><div class="hero-display-stats"><div><strong>${data.sellers.length}</strong><small>DEMO STOREFRONTS</small></div><div><strong>${verified}</strong><small>VERIFIED</small></div></div></div></div></section><div class="home-stats"><div><span>01 / PLATFORM</span><strong>Verified trade</strong><small>Business-first supplier discovery</small></div><div><span>02 / CATEGORIES</span><strong>Cosmetics & textiles</strong><small>Focused on growing Afghan sectors</small></div><div><span>03 / EXPANSION</span><strong>Kabul → Nationwide</strong><small>Herat and Mazar-e-Sharif roadmap</small></div></div><div class="section-heading"><div><span class="eyebrow">THE MARKETPLACE</span><h2>Discover what Etemad offers</h2><p class="muted">Explore the core experiences behind the platform.</p></div><button class="secondary" onclick="go('market')">View products ↗</button></div><div class="feature-grid"><button class="feature-tile" onclick="go('market')"><span class="feature-glyph">▦</span><span class="feature-number">01 / DISCOVER</span><strong>Explore suppliers</strong><p>Browse quality products and connect with Afghan sellers.</p><span class="feature-link">Explore marketplace ↗</span></button><button class="feature-tile" onclick="go('plans')"><span class="feature-glyph">♛</span><span class="feature-number">02 / GROW</span><strong>Membership plans</strong><p>Find the right tools and visibility for your business.</p><span class="feature-link">Compare memberships ↗</span></button><button class="feature-tile" onclick="go('dashboard')"><span class="feature-glyph">◇</span><span class="feature-number">03 / SELL</span><strong>Seller workspace</strong><p>Publish products, manage inquiries and grow your presence.</p><span class="feature-link">Open dashboard ↗</span></button></div><div class="home-banner"><div><span class="eyebrow">THE FUTURE OF ETEMAD</span><h2>From connections to commerce.</h2><p>Switch to Year 3 to explore the planned online buying and selling experience.</p></div><button class="gold" onclick="year=3;go('market')">Preview Year 3 shopping ↗</button></div>`}
const views={home,market,auctions,plans,seller:sellerStudio,dashboard:sellerDashboard,admin,checkout,roadmap};render();
</script></body></html>
