<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etemad | Trust. Verified. Connected.</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172638;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#102a46;color:white}button:hover{opacity:.88}.secondary{background:white;color:#173553;border:1px solid #cbd5e1}.gold{background:#b88c36;color:#111}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#102a46;color:white;padding:25px 15px}.brand{font-size:27px;font-weight:800;letter-spacing:3px;color:#e7c777}.tagline{font-size:12px;color:#c9d2dc;margin-bottom:25px}.nav{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:#e3eaf2}.nav.active{background:#254966}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#64748b}.notice{padding:12px 15px;border-radius:10px;background:#fff5d7;border:1px solid #ead39c;margin:16px 0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid #e0e6ed;border-radius:14px;padding:17px;box-shadow:0 2px 12px #102a4609}.product{padding:0;overflow:hidden}.art{height:150px;background:linear-gradient(135deg,#d9e2eb,#f3e4c6);display:grid;place-items:center;font-size:65px}.pad{padding:16px}.price{font-size:21px;font-weight:800;color:#102a46}.badge{display:inline-block;border-radius:50px;background:#e4f3ea;color:#17683e;padding:4px 9px;font-size:12px}.badge.pending{background:#fff1d2;color:#825b05}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.field{display:block;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:7px 0 12px;background:white}label{font-weight:600;font-size:13px}h1{font-size:26px;margin:6px 0}h2{font-size:20px}h3{margin:6px 0}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}th{background:#edf2f6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#e6ecf2;color:#183452}.tabs button.active{background:#102a46;color:white}.stat{font-size:27px;font-weight:800;color:#102a46}.rtl{direction:rtl;text-align:right}.footer{margin-top:30px;color:#718096;font-size:12px}@media(max-width:760px){.layout{display:block}.sidebar{padding:14px}.sidebar nav{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto}.main{padding:14px}.brand{font-size:21px}.tagline{margin-bottom:6px}table{display:block;overflow-x:auto}} </style></head><body><div id="root"></div><script>
const seed=[{id:1,name:'Kabul Beauty Traders',city:'Kabul',category:'Cosmetics',tier:'Gold',verified:true,product:'Rosewater Skin Care Set',price:18,emoji:'🧴',rating:4.8},{id:2,name:'Balkh Textile House',city:'Mazar-e-Sharif',category:'Textiles',tier:'Silver',verified:true,product:'Handwoven Cotton Fabric',price:32,emoji:'🧵',rating:4.7},{id:3,name:'Herat Cosmetics Studio',city:'Herat',category:'Cosmetics',tier:'Gold',verified:true,product:'Natural Makeup Collection',price:25,emoji:'💄',rating:4.6},{id:4,name:'Kabul Fabric Collective',city:'Kabul',category:'Textiles',tier:'Free',verified:false,product:'Printed Shawl',price:12,emoji:'🧣',rating:4.3},{id:5,name:'Pamir Textile Supply',city:'Kabul',category:'Textiles',tier:'Gold',verified:true,product:'Bulk Fabric Lot (20m)',price:95,emoji:'🪡',rating:4.9},{id:6,name:'Safaa Beauty Wholesale',city:'Kabul',category:'Cosmetics',tier:'Silver',verified:true,product:'Beauty Essentials Kit',price:14,emoji:'🧼',rating:4.5}];
const initial={sellers:seed,applications:[{id:101,name:'Noor Textile Workshop',city:'Kabul',category:'Textiles',tier:'Silver',status:'Pending',license:'DEMO-LIC-101'}],auctions:[{id:1,seller:5,product:'Bulk Fabric Lot (20m)',bid:110,bidder:'Demo Buyer',status:'Open'},{id:2,seller:1,product:'Seasonal Cosmetics Bundle',bid:40,bidder:'Demo Buyer',status:'Open'}],messages:[],disputes:[{id:1,seller:'Kabul Fabric Collective',issue:'Item description mismatch',status:'Open'}],orders:[]};
let data;try{data=JSON.parse(localStorage.getItem('etemad-demo'))||structuredClone(initial)}catch(e){data=structuredClone(initial)}
let page='market',lang='en',year=1,category='All',city='All',query='',role='Buyer';
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('etemad-demo',JSON.stringify(data)),seller=id=>data.sellers.find(x=>x.id===id)||{name:'Demo seller'},money=n=>'$'+Number(n).toFixed(2),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),t=(en,da,ps)=>lang==='en'?en:lang==='da'?da:ps;
const pages=[['market','Marketplace','بازار','بازار'],['auctions','Gold bidding','داوطلبی طلایی','د سرو زرو داوطلبي'],['plans','Membership','عضویت','غړیتوب'],['seller','Seller studio','پنل فروشنده','د پلورونکي پاڼه'],['admin','Administration','مدیریت','اداره'],['checkout','Year 3 checkout','پرداخت سال سوم','د درېیم کال تادیه'],['roadmap','Business roadmap','نقشه راه','د پرمختګ نقشه']];
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';$('root').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand">ETEMAD اعتماد</div><div class="tagline">Trust. Verified. Connected.</div><nav>${pages.map(p=>`<button class="nav ${page===p[0]?'active':''}" onclick="go('${p[0]}')">${t(p[1],p[2],p[3])}</button>`).join('')}</nav></aside><main class="main"><div class="top"><div><h1>${t('Verified Afghan Marketplace','بازار تاییدشده افغانستان','د افغانستان تایید شوی بازار')}</h1><span class="muted">${t('Cosmetics and textiles • Kabul-first','لوازم آرایشی و منسوجات • آغاز از کابل','سینګار توکي او ټوکر • لومړی کابل')}</span></div><div class="row"><select aria-label="Language" class="field" style="width:auto;margin:0" onchange="lang=this.value;render()"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="da" ${lang==='da'?'selected':''}>دری</option><option value="ps" ${lang==='ps'?'selected':''}>پښتو</option></select><select aria-label="Demo year" class="field" style="width:auto;margin:0" onchange="year=+this.value;render()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${year===n?'selected':''}>Year ${n}</option>`).join('')}</select></div></div><div class="notice">🎓 ${t('CLASSROOM SIMULATION: All businesses, documents, ratings, bids and payments are fictional. No real verification, payments or messages occur.','شبیه‌سازی صنفی: تمام اطلاعات و معاملات فرضی اند.','د ټولګي بېلګه: ټول معلومات او راکړې ورکړې خیالي دي.')}</div><div id="content">${views[page]()}</div><div class="footer">ETEMAD • MGT 352 Senior Project • Demonstration only • Browser-local storage</div></main></div>`}
function go(p){page=p;render()}
function market(){let items=data.sellers.filter(s=>(category==='All'||s.category===category)&&(city==='All'||s.city===city)&&[s.name,s.product,s.category].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>({Gold:0,Silver:1,Free:2}[a.tier]-{Gold:0,Silver:1,Free:2}[b.tier]));return `<div class="row"><input class="field" style="flex:2;min-width:190px" placeholder="Search products or sellers" value="${escape(query)}" oninput="query=this.value;updateMarket()"><select class="field" style="flex:1" onchange="category=this.value;updateMarket()"><option>All</option>${['Cosmetics','Textiles'].map(x=>`<option ${category===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" style="flex:1" onchange="city=this.value;updateMarket()"><option>All</option>${['Kabul','Herat','Mazar-e-Sharif'].map(x=>`<option ${city===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="products" class="grid">${items.map(s=>`<div class="card product"><div class="art">${s.emoji}</div><div class="pad"><div class="row space"><small>${s.category} · ${s.city}</small><span class="badge ${s.verified?'':'pending'}">${s.verified?'✓ Verified':'Unverified'}</span></div><h3>${escape(s.product)}</h3><div class="price">${money(s.price)}</div><p class="muted">${escape(s.name)} · ${s.tier} · ★ ${s.rating}</p><div class="row"><button onclick="contact(${s.id})">Contact seller</button><button class="secondary" onclick="review(${s.id})">Rate</button></div></div></div>`).join('')||'<p>No matching products.</p>'}</div>`}
function updateMarket(){$('content').innerHTML=market()}
function contact(id){let message=prompt('Message to '+seller(id).name+' (fictional demo only):');if(message){data.messages.push({seller:seller(id).name,message,created:new Date().toLocaleString()});save();alert('Demo message saved locally. No message was sent.')}}
function review(id){let r=Number(prompt('Demo rating (1 to 5):'));if(r>=1&&r<=5){seller(id).rating=r;save();render()}}
function auctions(){return `<h2>Gold-exclusive auctions · 3% fee on completed sales</h2><p class="muted">Only Gold sellers can create auctions. Registered demo buyers may bid. Highest valid bid wins when closed.</p><div class="grid">${data.auctions.map(a=>`<div class="card"><span class="badge">${a.status}</span><h3>${escape(a.product)}</h3><p>${escape(seller(a.seller).name)} · Gold</p><div class="stat">${money(a.bid)}</div><p class="muted">Leading bidder: ${escape(a.bidder)} · Fee if completed: ${money(a.bid*.03)}</p>${a.status==='Open'?`<button onclick="bid(${a.id})">Place bid</button> <button class="secondary" onclick="closeAuction(${a.id})">Close & complete demo sale</button>`:''}</div>`).join('')}</div>`}
function bid(id){let a=data.auctions.find(x=>x.id===id),n=Number(prompt('Enter bid (minimum '+money(a.bid+1)+')'));if(!Number.isFinite(n)||n<a.bid+1)return alert('Bid must exceed the current bid by at least $1.');a.bid=n;a.bidder='Demo Buyer';save();render()}
function closeAuction(id){let a=data.auctions.find(x=>x.id===id);if(confirm('Mark this fictional auction as completed?')){a.status='Completed';save();render()}}
function plans(){return `<h2>Annual seller membership</h2><div class="grid">${[['Free',0,'Basic listing, direct contact'],['Silver',year>=4?10:5,'Document verification, badge, priority placement'],['Gold',year>=4?15:10,'All Silver benefits, first placement, exclusive bidding']].map(([name,price,features])=>`<div class="card"><h2>${name}</h2><div class="stat">${money(price)}<small>/year</small></div><p>${features}</p><button onclick="alert('Demo plan selected: ${name}. Use Seller Studio to request verification.')">Select ${name}</button></div>`).join('')}</div><p class="muted">Year 1–3: Silver $5, Gold $10. Year 4–5: Silver $10, Gold $15. Buyers browse free.</p>`}
function sellerStudio(){return `<h2>Seller registration & storefront</h2><div class="grid"><div class="card"><h3>Apply for seller verification</h3><form onsubmit="apply(event)"><label>Business name<input required name="name" class="field" maxlength="70"></label><label>City<select name="city" class="field"><option>Kabul</option><option>Herat</option><option>Mazar-e-Sharif</option></select></label><label>Category<select name="category" class="field"><option>Cosmetics</option><option>Textiles</option></select></label><label>Membership<select name="tier" class="field"><option>Free</option><option>Silver</option><option>Gold</option></select></label><label>Fictional license reference<input required name="license" class="field" placeholder="DEMO-LIC-000"></label><button type="submit">Submit for review</button></form></div><div class="card"><h3>Demo seller dashboard</h3><div class="stat">${data.sellers.length}</div><p>Marketplace storefronts</p><p>Gold accounts can list products for bidding.</p><button class="gold" onclick="newAuction()">Create Gold auction</button><h3>Recent buyer inquiries</h3>${data.messages.slice(-5).map(m=>`<p><strong>${escape(m.seller)}:</strong> ${escape(m.message)}</p>`).join('')||'<p class="muted">No demo messages yet.</p>'}</div></div>`}
function apply(e){e.preventDefault();let f=new FormData(e.target);data.applications.push({id:Date.now(),...Object.fromEntries(f),status:'Pending'});save();alert('Application queued for demo admin review. No real documents uploaded.');render()}
function newAuction(){let gold=data.sellers.filter(x=>x.tier==='Gold');let id=Number(prompt('Gold seller ID: '+gold.map(x=>x.id+' = '+x.name).join(', ')));if(!gold.some(x=>x.id===id))return alert('Only Gold sellers can create auctions.');let product=prompt('Auction item name:');let bid=Number(prompt('Starting bid in USD:'));if(!product||!(bid>0))return;data.auctions.push({id:Date.now(),seller:id,product,bid,bidder:'No bids yet',status:'Open'});save();render()}
function admin(){return `<h2>Administration · verification and trust</h2><div class="grid"><div class="card"><div class="muted">Pending applications</div><div class="stat">${data.applications.filter(x=>x.status==='Pending').length}</div></div><div class="card"><div class="muted">Open disputes</div><div class="stat">${data.disputes.filter(x=>x.status==='Open').length}</div></div><div class="card"><div class="muted">Completed auctions</div><div class="stat">${data.auctions.filter(x=>x.status==='Completed').length}</div></div></div><h3>Verification queue</h3><table><tr><th>Business</th><th>City</th><th>Tier</th><th>License (demo)</th><th>Status</th><th>Action</th></tr>${data.applications.map(a=>`<tr><td>${escape(a.name)}</td><td>${escape(a.city)}</td><td>${escape(a.tier)}</td><td>${escape(a.license)}</td><td>${a.status}</td><td>${a.status==='Pending'?`<button onclick="decide(${a.id},'Approved')">Approve</button> <button class="secondary" onclick="decide(${a.id},'Rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</table><h3>Dispute review</h3><table><tr><th>Seller</th><th>Issue</th><th>Status</th><th>Action</th></tr>${data.disputes.map(d=>`<tr><td>${escape(d.seller)}</td><td>${escape(d.issue)}</td><td>${d.status}</td><td>${d.status==='Open'?`<button onclick="resolveDispute(${d.id})">Resolve</button>`:'—'}</td></tr>`).join('')}</table><p><button class="secondary" onclick="resetDemo()">Reset all demonstration data</button></p>`}
function decide(id,status){let a=data.applications.find(x=>x.id===id);a.status=status;if(status==='Approved')data.sellers.push({id:Date.now(),name:a.name,city:a.city,category:a.category,tier:a.tier,verified:a.tier!=='Free',product:'New demo storefront',price:10,emoji:a.category==='Textiles'?'🧵':'🧴',rating:5});save();render()}
function resolveDispute(id){data.disputes.find(x=>x.id===id).status='Resolved';save();render()}
function resetDemo(){if(confirm('Erase all browser-local demo changes?')){data=structuredClone(initial);save();render()}}
function checkout(){return `<h2>Year 3+ secure checkout / escrow concept</h2>${year<3?'<div class="notice">Roadmap preview only: checkout is planned for Year 3, not available in the Year 1 launch.</div>':''}<div class="grid"><div class="card"><h3>Simulate an escrow transaction</h3><label>Seller<select class="field" id="checkoutSeller">${data.sellers.filter(x=>x.tier!=='Free').map(s=>`<option value="${s.id}">${escape(s.name)}</option>`).join('')}</select></label><label>Order value (USD)<input class="field" id="amount" type="number" min="1" value="100"></label><label>Commission rate<select class="field" id="rate"><option value=".02">2%</option><option value=".03">3%</option></select></label><button onclick="simulateCheckout()">Simulate checkout</button></div><div class="card"><h3>Escrow stages (simulation)</h3><p>1. Buyer initiates payment</p><p>2. Funds held in escrow (illustrative only)</p><p>3. Seller fulfills order</p><p>4. Buyer confirms delivery</p><p>5. Seller receives balance after commission</p><strong>No actual funds are processed or held.</strong></div></div><h3>Demo transaction history</h3><table><tr><th>Seller</th><th>Order</th><th>Commission</th><th>Seller proceeds</th></tr>${data.orders.map(o=>`<tr><td>${escape(o.seller)}</td><td>${money(o.amount)}</td><td>${money(o.fee)}</td><td>${money(o.amount-o.fee)}</td></tr>`).join('')}</table>`}
function simulateCheckout(){let amount=Number($('amount').value),rate=Number($('rate').value);if(!(amount>0))return alert('Enter a valid order value.');let s=seller(Number($('checkoutSeller').value));data.orders.push({seller:s.name,amount,fee:amount*rate});save();render();alert('Fictional checkout completed. No real payment occurred.')}
function roadmap(){return `<h2>Five-year growth roadmap</h2><div class="grid">${[[1,'Kabul launch','1,000 businesses; 400 Silver; 100 Gold; bidding live'],[2,'Kabul expansion','3,000 businesses; 1,200 Silver; 300 Gold'],[3,'Escrow introduction','Secure checkout and 2–3% transaction commission'],[4,'Regional partnerships','Herat and Mazar-e-Sharif expansion; logistics and mobile-money partnerships'],[5,'Scale-up','20,000 registered businesses; 8,000 Silver; 2,000 Gold; $1.5M GMV target']].map(([n,title,desc])=>`<div class="card" style="border-top:4px solid ${year===n?'#b88c36':'#102a46'}"><span class="muted">YEAR ${n}</span><h3>${title}</h3><p>${desc}</p></div>`).join('')}</div><h2>Business model assumptions</h2><p>Startup budget $9,600, founders' capital $18,000, no bank debt. Initial direct seller contact; 3% Gold auction fee from Year 1; broader checkout commission from Year 3.</p><p class="muted">Targets are business-plan projections, not achieved operating results.</p>`}
const views={market,auctions,plans,seller:sellerStudio,admin,checkout,roadmap};render();
</script></body></html>
